# Alembic configuration for SupportFlow.
#
# The URL is resolved by migrations/env.py, in this order:
#   1. the -x db_url=... command-line argument (wins, and keeps secrets
#      out of files and shell history where possible);
#   2. sqlalchemy.url below;
#   3. SUPPORTFLOW_DATABASE_URL from app settings (.env).
#
# sqlalchemy.url is intentionally empty: credentials never live in this
# file. Typical usage:
#
#   uv run alembic -x db_url=postgresql+psycopg://supportflow:...@127.0.0.1:5432/supportflow upgrade head
#   uv run alembic -x db_url=postgresql+psycopg://u:p@127.0.0.1:5432/supportflow upgrade head --sql

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =
